# Runs the type check and a production build on every pull request, so a broken
# page or bad frontmatter is caught before it reaches the Cloudflare deploy.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
